# https://render.com/docs/infrastructure-as-code
# Click "New" → "Blueprint" in the Render dashboard and point it at this repo.

databases:
  - name: osm-sync-db
    plan: free
    databaseName: osm
    user: osm

services:
  - type: web
    name: osm-sync
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: osm-sync-db
          property: connectionString
      - key: OSM_CLIENT_ID
        sync: false                # you fill this in the Render dashboard
      - key: OSM_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false                # e.g. https://osm-sync.onrender.com/auth/callback
      - key: WEB_ORIGIN
        sync: false                # e.g. https://osm-sync.onrender.com
      - key: TOKEN_ENC_KEY
        sync: false                # run: openssl rand -base64 32  — paste the output here
      - key: NODE_VERSION
        value: "22"